syntax = "proto3";

package iam.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/sujithsss01/email_server/src/iam/internal/pb;iampb";

service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
}
message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  string user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string username = 4;
  string email = 5;
  string phone_number = 6;
}

message CreateUserRequest {
  string first_name = 1 [(buf.validate.field).string.min_len = 1];
  string last_name = 2 [(buf.validate.field).string.min_len = 1];
  string username = 3 [(buf.validate.field).string.min_len = 1];
  string email = 4 [(buf.validate.field).string.min_len = 1];
  string phone_number = 5 [
    (buf.validate.field).string.min_len = 6,
    (buf.validate.field).string.max_len = 15
  ];
  string password = 6 [
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_len = 72
  ];
}

message CreateUserResponse {
  string status = 1;
  string user_id = 2;
}
